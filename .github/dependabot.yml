version: 2
updates:
    # Fetch and update latest `npm` packages
    - package-ecosystem: npm
      directory: "/"
      target-branch: "main"
      labels:
          - "Technical Dept"
      schedule:
          interval: weekly
          time: "05:00"
      commit-message:
          prefix: chore
          prefix-development: chore
          include: scope
      cooldown:
          default-days: 5
          semver-major-days: 14
          semver-minor-days: 5
          semver-patch-days: 3
      ignore:
          # Preact must stay on the major diagram-js depends on: the color
          # picker shares diagram-js's Preact runtime (ADR 0038), so a lone
          # bump would install two runtimes. Lift once diagram-js moves.
          - dependency-name: "preact"
            update-types:
                - "version-update:semver-major"
      groups:
          # Weekly version updates arrive as two PRs: minor/patch bumps that
          # should merge as-is, and majors that may need migration work, so
          # one breaking major never blocks the routine bumps.
          npm-minor-patch:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch
              patterns:
                  - "*"
          npm-major:
              applies-to: version-updates
              update-types:
                  - major
              patterns:
                  - "*"
          # Security updates are collected into one PR as well, separate from
          # the weekly version groups so they can still be fast-tracked.
          npm-security:
              applies-to: security-updates
              patterns:
                  - "*"
    # Fetch and update latest `github-actions` packages
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          time: "05:00"
      target-branch: "main"
      labels:
          - "Technical Dept"
      commit-message:
          prefix: chore
          prefix-development: chore
          include: scope
      groups:
          github-actions-all:
              patterns:
                  - "*"
    # Fetch and update latest `gradle` packages (IntelliJ plugin module).
    - package-ecosystem: gradle
      directory: "/apps/intellij-plugin"
      target-branch: "main"
      labels:
          - "Technical Dept"
      schedule:
          interval: weekly
          time: "05:00"
      commit-message:
          prefix: chore
          prefix-development: chore
          include: scope
      cooldown:
          default-days: 5
          semver-major-days: 14
          semver-minor-days: 5
          semver-patch-days: 3
      groups:
          gradle-minor-patch:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch
              patterns:
                  - "*"
          gradle-major:
              applies-to: version-updates
              update-types:
                  - major
              patterns:
                  - "*"
