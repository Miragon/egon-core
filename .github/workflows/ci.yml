name: CI

on:
    pull_request:
    push:
        branches: [main]
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    # Cancel superseded runs on feature branches, but never on `main` — a push to
    # `main` must always complete so its status is recorded for branch protection.
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn lint

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn typecheck

    format-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn format:check

    # Runs the unit and browser tiers together so coverage is merged and gated
    # per layer (ADR TST-1). The browser tier needs chromium on the runner.
    test:
        runs-on: ubuntu-latest
        # actions: read lets a PR fetch main's coverage baseline artifact;
        # pull-requests: write lets the coverage action post/update its comment.
        permissions:
            contents: read
            actions: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            # --with-deps pulls chromium's apt libraries; the browser version is
            # pinned via the exact-pinned playwright dependency.
            - run: yarn playwright install --with-deps chromium
            - run: yarn test:coverage
            # Every green main push publishes the baseline that PR comments
            # compare against.
            - name: Upload coverage baseline
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: coverage-summary-main
                  path: coverage/coverage-summary.json
                  retention-days: 90
            # The newest successful main run is the baseline. A missing baseline
            # only drops the deltas from the comment, so it never fails the job.
            - name: Download coverage baseline
              id: baseline
              if: always() && github.event_name == 'pull_request'
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
                    --workflow ci.yml --branch main --event push --status success \
                    --limit 1 --json databaseId --jq '.[0].databaseId // empty')
                  test -n "$run_id"
                  gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                    --name coverage-summary-main --dir coverage-main
                  echo "summary=coverage-main/coverage-summary.json" >> "$GITHUB_OUTPUT"
            # if: always() so a failing test run still reports coverage;
            # continue-on-error so read-only fork tokens can't fail the job.
            # The action reads only the first threshold in vite.config.mts, so
            # its targets are the domain's; the per-layer gate is vitest's.
            - name: Report coverage on the PR
              if: always() && github.event_name == 'pull_request'
              continue-on-error: true
              uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
              with:
                  json-summary-compare-path: ${{ steps.baseline.outputs.summary }}
                  file-coverage-mode: changes

    # Public-consumer journeys against source, through exact package aliases.
    test-e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn playwright install --with-deps chromium
            - run: yarn build
            - run: yarn test:e2e
            - name: Upload Playwright failure artifacts
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: |
                      playwright-report
                      test-results
                  if-no-files-found: ignore
                  retention-days: 7

    # The same journeys against a packed egon-core, installed by an isolated
    # consumer outside the checkout.
    test-package:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn playwright install --with-deps chromium
            - run: yarn test:package
            - name: Upload package-consumer failure artifacts
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: package-playwright-report
                  path: |
                      playwright-report/package
                      test-results/package
                  if-no-files-found: ignore
                  retention-days: 7

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn build

    # Exact pins keep installs reproducible and force upgrades through
    # reviewed Dependabot PRs.
    pin-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2

    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

    # The whole tree on every run; dependency-review only sees added deps.
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn npm audit --all --severity high

    # Single required status check for branch protection. `if: always()` runs it
    # even when a needed job fails, and the jq gate then fails unless every job
    # succeeded or was skipped (dependency-review skips on push).
    ci:
        if: always()
        needs:
            [
                lint,
                typecheck,
                format-check,
                test,
                test-e2e,
                test-package,
                build,
                pin-check,
                dependency-review,
                audit,
            ]
        runs-on: ubuntu-latest
        steps:
            - name: Check all jobs passed or were skipped
              run: |
                  results='${{ toJSON(needs) }}'
                  echo "$results" | jq -e '
                    to_entries | all(
                      .value.result == "success" or .value.result == "skipped"
                    )
                  '
