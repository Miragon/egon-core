name: CI

on:
    pull_request:
    push:
        branches: [main]
    merge_group:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    # Cancel superseded runs on feature branches, but never on `main` — a push to
    # `main` must always complete so its status is recorded for branch protection.
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn lint

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn typecheck

    format-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn format:check

    test:
        runs-on: ubuntu-latest
        # pull-requests: write lets the coverage action post/update its comment.
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn test:coverage
            # if: always() so a failing test run still reports coverage;
            # continue-on-error so read-only fork tokens can't fail the job.
            - name: Report coverage on the PR
              if: always() && github.event_name == 'pull_request'
              continue-on-error: true
              uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2

    # Real-browser tier: boots a genuine EgonClient in headless chromium, which
    # jsdom can't (diagram-js measures SVG via getBBox). Kept a separate job so
    # the fast unit `test` job still gates coverage without a browser download.
    test-browser:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            # --with-deps pulls chromium's apt libraries; the browser version is
            # pinned via the exact-pinned playwright dependency.
            - run: yarn playwright install --with-deps chromium
            - run: yarn test:browser

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn build

    # Fails the build if any dependency in package.json uses a `^`/`~` range.
    # Exact pins make installs reproducible and force upgrades through a
    # reviewed PR (via Dependabot) instead of resolving silently in CI.
    pin-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: miragon/pin-npm-dependencies@58fe24377aef66748a1444ff69ab05e3f938a798 # v1.2.1

    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

    # Scans the whole dependency tree for known high-severity advisories on every
    # run; complements dependency-review, which only inspects deps added in a PR.
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/setup
            - run: yarn npm audit --all --severity high

    # Single required status check for branch protection. `if: always()` runs it
    # even when a needed job fails, and the jq gate then fails unless every job
    # succeeded or was skipped (dependency-review skips on push).
    ci:
        if: always()
        needs:
            [
                lint,
                typecheck,
                format-check,
                test,
                test-browser,
                build,
                pin-check,
                dependency-review,
                audit,
            ]
        runs-on: ubuntu-latest
        steps:
            - name: Check all jobs passed or were skipped
              run: |
                  results='${{ toJSON(needs) }}'
                  echo "$results" | jq -e '
                    to_entries | all(
                      .value.result == "success" or .value.result == "skipped"
                    )
                  '
