name: CodeQL

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        # Weekly scan catches advisories published after a PR merged.
        - cron: "23 4 * * 1"

permissions:
    contents: read

concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: Analyze (javascript-typescript)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write # upload results to the Security tab
            actions: read # required for workflow visibility on private repos

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
              with:
                  languages: javascript-typescript
                  # JS/TS is analysed from source — no compilation step needed.
                  build-mode: none

            - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
              with:
                  category: "/language:javascript-typescript"
