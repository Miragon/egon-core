name: Release archive validation

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to validate
                required: true
                default: main
                type: string

permissions:
    contents: read

concurrency:
    group: release-archive-${{ github.event.release.tag_name || inputs.ref }}
    cancel-in-progress: false

jobs:
    test-package:
        runs-on: ubuntu-latest
        env:
            REQUESTED_REF: ${{ github.event.release.tag_name || inputs.ref }}
        steps:
            - name: Set up Node 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Resolve source ref
              id: source
              env:
                  API_TOKEN: ${{ github.token }}
              run: |
                  encoded_ref="$(jq -rn --arg ref "$REQUESTED_REF" '$ref | @uri')"
                  commit="$(curl --fail --silent --show-error \
                    --header "Authorization: Bearer $API_TOKEN" \
                    --header "X-GitHub-Api-Version: 2022-11-28" \
                    "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$encoded_ref" \
                    | jq -er '.sha')"
                  echo "commit=$commit" >> "$GITHUB_OUTPUT"

            - name: Download GitHub source archive
              env:
                  API_TOKEN: ${{ github.token }}
                  COMMIT: ${{ steps.source.outputs.commit }}
              run: |
                  source_root="$RUNNER_TEMP/egon-core-source"
                  mkdir -p "$source_root"
                  curl --fail --location --retry 3 \
                    --header "Authorization: Bearer $API_TOKEN" \
                    --header "X-GitHub-Api-Version: 2022-11-28" \
                    "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/tarball/$COMMIT" \
                    | tar -xz --strip-components=1 -C "$source_root"

            - name: Install source archive dependencies
              run: |
                  corepack enable
                  yarn install --immutable
              working-directory: ${{ runner.temp }}/egon-core-source

            - name: Install Chromium
              run: yarn playwright install --with-deps chromium
              working-directory: ${{ runner.temp }}/egon-core-source

            - name: Pack source archive
              env:
                  COMMIT: ${{ steps.source.outputs.commit }}
              run: |
                  package_archive="$RUNNER_TEMP/egon-core-$COMMIT.tgz"
                  yarn pack --out "$package_archive"
                  echo "PACKAGE_ARCHIVE=$package_archive" >> "$GITHUB_ENV"
              working-directory: ${{ runner.temp }}/egon-core-source

            - name: Validate installed package archive
              run: yarn test:package --archive "$PACKAGE_ARCHIVE"
              working-directory: ${{ runner.temp }}/egon-core-source

            - name: Upload failure traces and reports
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: release-archive-playwright-${{ steps.source.outputs.commit }}
                  path: |
                      ${{ runner.temp }}/egon-core-source/playwright-report/package
                      ${{ runner.temp }}/egon-core-source/test-results/package
                  if-no-files-found: ignore
                  retention-days: 7
