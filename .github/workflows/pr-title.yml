name: PR Title

# The squash-merged PR title is what release-please parses, so a malformed one
# silently yields no release. `edited` is required: fixing a title fires only
# `edited`, so the check would otherwise stay red until an unrelated push.
on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

permissions:
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Validate Conventional Commit title
        runs-on: ubuntu-latest
        steps:
            - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      refactor
                      docs
                      chore
                  requireScope: false
